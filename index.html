<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Acompanhamento Pedagógico 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Biblioteca para trabalhar com PDF -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

  <!-- ======== ESTILOS MODERNOS E RESPONSIVOS ======== -->
  <style>
    :root{
      --bg:#f7fafc;
      --card:#ffffff;
      --text:#233240;
      --muted:#6b7280;
      --accent-1:#bfe8ff; /* azul claro */
      --accent-2:#dff7ea; /* verde suave */
      --accent-3:#fff6d6; /* amarelo pastel */
      --accent-4:#ffeef6; /* rosa claro */
      --accent-5:#fff3e0; /* laranja claro */
      --primary:#2b6cb0;
      --success:#2f855a;
      --shadow: 0 6px 18px rgba(35,50,64,0.08);
      --radius:12px;
      --gap:14px;
    }

    html{scroll-behavior:smooth;}

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
    }

    /* Cabeçalho fixo moderno */
    header.app-header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:64px;
      background:linear-gradient(90deg,var(--card),#f8fbff);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px 20px;
      box-shadow:0 4px 12px rgba(15,23,42,0.06);
      z-index:999;
      transition:box-shadow .35s, transform .25s;
    }
    header.app-header.highlight{
      box-shadow:0 10px 28px rgba(39,105,171,0.14);
      transform:translateY(-2px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand h1{
      font-size:18px;
      margin:0;
      color:var(--primary);
      letter-spacing:0.2px;
    }
    .header-actions{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:10px;
      border:none;
      background: linear-gradient(180deg,var(--success),#2b8a51);
      color:white;
      cursor:pointer;
      font-weight:600;
      box-shadow: var(--shadow);
      text-decoration:none;
    }
    .btn.ghost{
      background:transparent;
      color:var(--primary);
      border:1px solid rgba(43,108,176,0.2);
      box-shadow:none;
    }
    .btn.ghost:hover{
      background: rgba(43,108,176,0.05);
    }
    .btn:active{transform:translateY(1px);}

    /* Container do formulário */
    .container{
      max-width:1000px;
      margin:92px auto 40px;
      padding:20px;
    }

    /* Card principal */
    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }

    h2.section-title{
      margin:0 0 10px 0;
      font-size:16px;
      color:var(--primary);
    }
    p.lead{
      margin:6px 0 18px 0;
      color:var(--muted);
      font-size:14px;
    }

    /* Accordion styles */
    .accordion{
      width:100%;
      background:transparent;
      border:0;
      padding:12px 14px;
      margin:10px 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      cursor:pointer;
      border-radius:12px;
      transition:background .2s, transform .15s;
    }
    .accordion:hover{ transform:translateY(-2px); }
    .accordion .left{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .acc-icon{
      width:36px;
      height:36px;
      border-radius:10px;
      display:inline-grid;
      place-items:center;
      font-size:16px;
    }
    .acc-title{
      font-weight:700;
    }
    .acc-sub{
      display:block;
      font-size:12px;
      color:var(--muted);
    }
    .acc-arrow{
      transition:transform .25s;
    }

    .panel{
      overflow:hidden;
      max-height:0;
      transition:max-height .35s ease, padding .25s;
      padding:0 0;
    }
    .panel.open{
      padding:12px 0 18px 0;
    }

    /* Form grid */
    .form-row{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-bottom:10px;
    }
    label.field{
      display:block;
      font-size:13px;
      color:var(--text);
      margin-bottom:4px;
    }
    input[type="text"], select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(15,23,42,0.08);
      outline:none;
      font-size:14px;
      background:linear-gradient(180deg,#fff,#fbfdff);
    }
    textarea{min-height:80px; resize:vertical;}

    /* Buttons area */
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:14px;
    }

    /* Section accent backgrounds */
    .accent-1{ background: linear-gradient(90deg,var(--accent-1),#e6f7ff); }
    .accent-2{ background: linear-gradient(90deg,var(--accent-2),#f0fff6); }
    .accent-3{ background: linear-gradient(90deg,var(--accent-3),#fffdf0); }
    .accent-4{ background: linear-gradient(90deg,var(--accent-4),#fff7fb); }
    .accent-5{ background: linear-gradient(90deg,var(--accent-5),#fff7ed); }

    /* Layout Responsivo */
    .form-grid-3{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:700px){
      .form-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .form-grid-3{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; }
    }

    /* Barra de progresso */
    .progress-container {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: var(--radius);
      overflow: hidden;
      height: 18px;
      margin-bottom: 15px;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      color: white;
      font-size: 12px;
      text-align: center;
      line-height: 18px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- ========== CABEÇALHO FIXO ========== -->
  <header class="app-header" id="appHeader" role="banner">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="3" width="20" height="18" rx="3" fill="#e6f7ff"></rect>
        <path d="M5 8h14" stroke="#2b6cb0" stroke-width="1.2"></path>
        <path d="M5 12h14" stroke="#2b6cb0" stroke-width="1.2"></path>
      </svg>
      <h1>Acompanhamento Pedagógico 2025</h1>
    </div>

    <div class="header-actions">
      <!-- Input oculto para selecionar o PDF -->
      <input type="file" id="pdfFileInput" accept="application/pdf" style="display:none;">
      
      <!-- Botão de Carregar PDF -->
      <button id="btnCarregarPdf" type="button" class="btn ghost" title="Carregar PDF preenchido para alterar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 15V3m0 0l-4 4m4-4l4 4" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Carregar PDF
      </button>

      <button id="btnResetTop" class="btn ghost" title="Novo formulário (limpar e ir ao topo)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M20 7v6h-6" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17a8 8 0 118 8" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Novo Formulário
      </button>
    </div>
  </header>

  <!-- ========== CONTAINER PRINCIPAL ========== -->
  <main class="container" role="main">
    <div class="card">

      <h2 class="section-title">Formulário de Acompanhamento Pedagógico</h2>
      <p class="lead">Preencha as seções abaixo ou carregue um PDF preenchido para editar. Use o botão <strong>Gerar PDF</strong> quando finalizar.</p>

      <!-- Barra de Progresso -->
      <div class="progress-container">
        <div id="progressBar" class="progress-bar">0%</div>
      </div>

      <!-- ======== FORMULÁRIO ======== -->
      <form id="formulario" class="form-root" autocomplete="off">
        
        <!-- === NOVOS CAMPOS DE IDENTIFICAÇÃO === -->
        <div class="form-row form-grid-2">
          <div>
            <label class="field">Professora
              <input id="professora" name="professora" type="text" required placeholder="Nome da professora">
            </label>
          </div>
          <div>
            <label class="field">Turma
              <input id="turma" name="turma" type="text" required placeholder="Ex: Maternal A">
            </label>
          </div>
        </div>

        <div class="form-row form-grid-3">
          <div>
            <label class="field">Observador(a)
              <input id="observador" name="observador" type="text" required placeholder="Nome do observador(a)">
            </label>
          </div>
          <div>
            <label class="field">Dia / Mês / Ano
              <div style="display: flex; gap: 6px;">
                <input id="dia" name="dia" type="text" required placeholder="Dia" maxlength="2" style="text-align: center;">
                <input id="mes" name="mes" type="text" required placeholder="Mês" maxlength="2" style="text-align: center;">
                <input id="ano" name="ano" type="text" required placeholder="Ano" maxlength="4" style="text-align: center;">
              </div>
            </label>
          </div>
        </div>

        <!-- SEÇÃO I -->
        <button type="button" class="accordion accent-1" data-panel="secao1" id="secao1Btn">
          <div class="left">
            <span class="acc-icon">1</span>
            <div>
              <span class="acc-title">SEÇÃO I - APROPRIAÇÃO DO CURRÍCULO</span>
              <span class="acc-sub">Compreensão sobre currículo, BNCC e alfabetização.</span>
            </div>
          </div>
          <svg class="acc-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M6 9l6 6 6-6" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="secao1" class="panel">
          <div class="form-row">
            <label class="field">1. Há compreensão sobre os impactos negativos das interações inadequadas para as crianças?</label>
            <select name="SEC_I_1">
              <option value="">Selecione</option>
              <option value="1">[1] Não conhece e não tem senso crítico formado sobre o objetivo da Educação Infantil; não expressa opinião sobre o tema.</option>
              <option value="2">[2] Sim, conhece e/ou reconhece, porém não partilha dessa visão; discorda do currículo da rede e do Brasil.</option>
              <option value="3">[3] Em processo, conhece superficialmente, mas tem desejo de conhecer mais e partilhar da mesma visão da rede.</option>
              <option value="4">[4] Sim, conhece e/ou reconhece, e partilha dessa visão.</option>
            </select>
          </div>

          <div class="form-row">
            <label class="field">2. Há clareza sobre os objetivos da Educação Infantil?</label>
            <select name="SEC_I_2">
              <option value="">Selecione</option>
              <option value="1">[1] Não conhece e não tem senso crítico formado sobre o objetivo da Educação Infantil; não expressa opinião sobre o tema.</option>
              <option value="2">[2] Sim, conhece e/ou reconhece, porém não partilha dessa visão; discorda do currículo da rede e do Brasil.</option>
              <option value="3">[3] Em processo, conhece superficialmente, mas tem desejo de conhecer mais e partilhar da mesma visão da rede.</option>
              <option value="4">[4] Sim, conhece e/ou reconhece, e partilha dessa visão.</option>
            </select>
          </div>

          <div class="form-row">
            <label class="field">3. Compreende que o papel na Educação Infantil vai além do cuidar?</label>
            <select name="SEC_I_3">
              <option value="">Selecione</option>
              <option value="1">[1] Não conhece e não tem senso crítico formado sobre o objetivo da Educação Infantil; não expressa opinião sobre o tema.</option>
              <option value="2">[2] Sim, conhece e/ou reconhece, porém não partilha dessa visão; discorda do currículo da rede e do Brasil.</option>
              <option value="3">[3] Em processo, conhece superficialmente, mas tem desejo de conhecer mais e partilhar da mesma visão da rede.</option>
              <option value="4">[4] Sim, conhece e/ou reconhece, e partilha dessa visão.</option>
            </select>
          </div>

          <div class="form-row">
            <label class="field">4. Reconhece a importância de trabalhar as competências gerais presentes na BNCC?</label>
            <select name="SEC_I_4">
              <option value="">Selecione</option>
              <option value="1">[1] Não conhece e não tem senso crítico formado sobre o objetivo da Educação Infantil; não expressa opinião sobre o tema.</option>
              <option value="2">[2] Sim, conhece e/ou reconhece, porém não partilha dessa visão; discorda do currículo da rede e do Brasil.</option>
              <option value="3">[3] Em processo, conhece superficialmente, mas tem desejo de conhecer mais e partilhar da mesma visão da rede.</option>
              <option value="4">[4] Sim, conhece e/ou reconhece, e partilha dessa visão.</option>
            </select>
          </div>

          <div class="form-row">
            <label class="field">5. Reconhece a importância da alfabetização na Educação Infantil? Qual o papel da Educação Infantil nesse processo?</label>
            <select name="SEC_I_5">
              <option value="">Selecione</option>
              <option value="1">[1] Não conhece e não tem senso crítico formado sobre o objetivo da Educação Infantil; não expressa opinião sobre o tema.</option>
              <option value="2">[2] Sim, conhece e/ou reconhece, porém não partilha dessa visão; discorda do currículo da rede e do Brasil.</option>
              <option value="3">[3] Em processo, conhece superficialmente, mas tem desejo de conhecer mais e partilhar da mesma visão da rede.</option>
              <option value="4">[4] Sim, conhece e/ou reconhece, e partilha dessa visão.</option>
            </select>
          </div>
        </div>

        <!-- AÇÕES FINAIS -->
        <div class="actions">
          <button type="submit" id="btnGeneratePdf2" class="btn" title="Gerar PDF">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M12 3v12" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 11l4 4 4-4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 21H3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Gerar PDF
          </button>

          <button id="btnLimparForm" type="reset" class="btn ghost"> 
            Limpar Formulário
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>	
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const accButtons = document.querySelectorAll('.accordion');
      accButtons.forEach(btn => {
        btn.addEventListener('click', function(){
          const panelId = this.getAttribute('data-panel');
          const panel = document.getElementById(panelId);
          const isOpen = panel.classList.contains('open');

          document.querySelectorAll('.panel').forEach(p => {
            p.classList.remove('open');
            p.style.maxHeight = null;
          });
          document.querySelectorAll('.acc-arrow').forEach(a => a.style.transform = 'rotate(0deg)');

          if(!isOpen){
            panel.classList.add('open');
            panel.style.maxHeight = panel.scrollHeight + 'px';
            const arrow = this.querySelector('.acc-arrow');
            if(arrow) arrow.style.transform = 'rotate(180deg)';
          }
        });
      });

      const firstBtn = document.querySelector('.accordion[data-panel="secao1"]');
      if(firstBtn) firstBtn.click();
    });
  </script>
</body>
</html>
