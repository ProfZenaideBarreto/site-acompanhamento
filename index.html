	
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Acompanhamento Pedagógico 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Biblioteca para trabalhar com PDF se necessário (mantida do original) -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

  <!-- ======== ESTILOS MODERNOS E RESPONSIVOS ======== -->
  <style>
    :root{
      --bg:#f7fafc;
      --card:#ffffff;
      --text:#233240;
      --muted:#6b7280;
      --accent-1:#bfe8ff; /* azul claro */
      --accent-2:#dff7ea; /* verde suave */
      --accent-3:#fff6d6; /* amarelo pastel */
      --accent-4:#ffeef6; /* rosa claro */
      --accent-5:#fff3e0; /* laranja claro */
      --primary:#2b6cb0;
      --success:#2f855a;
      --shadow: 0 6px 18px rgba(35,50,64,0.08);
      --radius:12px;
      --gap:14px;
    }

    html{scroll-behavior:smooth;}

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
    }

    /* Cabeçalho fixo moderno */
    header.app-header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:64px;
      background:linear-gradient(90deg,var(--card),#f8fbff);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px 20px;
      box-shadow:0 4px 12px rgba(15,23,42,0.06);
      z-index:999;
      transition:box-shadow .35s, transform .25s;
    }
    header.app-header.highlight{
      box-shadow:0 10px 28px rgba(39,105,171,0.14);
      transform:translateY(-2px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand h1{
      font-size:18px;
      margin:0;
      color:var(--primary);
      letter-spacing:0.2px;
    }
    .header-actions{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:10px;
      border:none;
      background: linear-gradient(180deg,var(--success),#2b8a51);
      color:white;
      cursor:pointer;
      font-weight:600;
      box-shadow: var(--shadow);
      text-decoration:none;
    }
    .btn.ghost{
      background:transparent;
      color:var(--primary);
      border:1px solid rgba(43,108,176,0.08);
      box-shadow:none;
    }
    .btn:active{transform:translateY(1px);}

    /* Container do formulário (com espaço para o header fixo) */
    .container{
      max-width:1000px;
      margin:92px auto 40px;
      padding:20px;
    }

    /* Card principal */
    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }

    h2.section-title{
      margin:0 0 10px 0;
      font-size:16px;
      color:var(--primary);
    }
    p.lead{
      margin:6px 0 18px 0;
      color:var(--muted);
      font-size:14px;
    }

    /* Accordion styles */
    .accordion{
      width:100%;
      background:transparent;
      border:0;
      padding:12px 14px;
      margin:10px 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      cursor:pointer;
      border-radius:12px;
      transition:background .2s, transform .15s;
    }
    .accordion:hover{ transform:translateY(-2px); }
    .accordion .left{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .acc-icon{
      width:36px;
      height:36px;
      border-radius:10px;
      display:inline-grid;
      place-items:center;
      font-size:16px;
    }
    .acc-title{
      font-weight:700;
    }
    .acc-sub{
      display:block;
      font-size:12px;
      color:var(--muted);
    }
    .acc-arrow{
      transition:transform .25s;
    }

    .panel{
      overflow:hidden;
      max-height:0;
      transition:max-height .35s ease, padding .25s;
      padding:0 0;
    }
    .panel.open{
      padding:12px 0 18px 0;
    }

    /* Form grid */
    .form-row{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-bottom:10px;
    }
    label.field{
      display:block;
      font-size:13px;
      color:var(--text);
      margin-bottom:4px;
    }
    input[type="text"], select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(15,23,42,0.08);
      outline:none;
      font-size:14px;
      background:linear-gradient(180deg,#fff,#fbfdff);
    }
    textarea{min-height:80px; resize:vertical;}

    /* Buttons area */
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:14px;
    }

    /* WhatsApp button style */
    .whatsapp{
      background:linear-gradient(90deg,#25D366,#1DA851);
      padding:10px 12px;
      border-radius:10px;
      color:white;
      display:inline-flex;
      gap:8px;
      align-items:center;
      text-decoration:none;
      font-weight:700;
      box-shadow:0 8px 20px rgba(37,211,102,0.12);
    }

    /* Section accent backgrounds for header of each accordion */
    .accent-1{ background: linear-gradient(90deg,var(--accent-1),#e6f7ff); }
    .accent-2{ background: linear-gradient(90deg,var(--accent-2),#f0fff6); }
    .accent-3{ background: linear-gradient(90deg,var(--accent-3),#fffdf0); }
    .accent-4{ background: linear-gradient(90deg,var(--accent-4),#fff7fb); }
    .accent-5{ background: linear-gradient(90deg,var(--accent-5),#fff7ed); }

    /* Small screens adjustments */
    @media (min-width:700px){
      .form-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    }
  
    /* Barra de progresso */
    .progress-container {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: var(--radius);
      overflow: hidden;
      height: 18px;
      margin-bottom: 15px;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      color: white;
      font-size: 12px;
      text-align: center;
      line-height: 18px;
      transition: width 0.3s ease;
    }

</style>
</head>
<body>

  <!-- ========== CABEÇALHO FIXO ========== -->
  <header class="app-header" id="appHeader" role="banner" aria-label="Cabeçalho do formulário">
    <div class="brand" aria-hidden="true">
      <!-- Pequeno ícone educativo (SVG) -->
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2" y="3" width="20" height="18" rx="3" fill="#e6f7ff"></rect>
        <path d="M5 8h14" stroke="#2b6cb0" stroke-width="1.2"></path>
        <path d="M5 12h14" stroke="#2b6cb0" stroke-width="1.2"></path>
      </svg>
      <h1>Acompanhamento Pedagógico 2025</h1>
    </div>

    <div class="header-actions">
      <!-- Botão Novo Formulário: reseta e rola para topo -->
      <button id="btnResetTop" class="btn ghost" title="Novo formulário (limpar e ir ao topo)">
        <!-- Ícone de refresh -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 7v6h-6" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17a8 8 0 118 8" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Novo Formulário
      </button>
	 </div>
  </header>

  <!-- ========== CONTAINER PRINCIPAL ========== -->
  <main class="container" role="main">
    <div class="card" aria-live="polite">

      <h2 class="section-title">Formulário de Acompanhamento Pedagógico</h2>
      <p class="lead">Preencha as seções abaixo. Use o botão <strong>Gerar PDF</strong> quando finalizar.</p>

      <!-- Barra de Progresso -->
      <div class="progress-container">
        <div id="progressBar" class="progress-bar">0%</div>
      </div>

      <!-- ======== FORMULÁRIO (mantém todos os campos originais, organizados) ======== -->
      <form id="formulario" class="form-root" autocomplete="off">
        <!-- === Campos iniciais (Creche / Turma / Turno) === -->
        <!-- Comentário: Esses campos são usados para identificar o PDF gerado e o compartilhamento no WhatsApp -->
        <div class="form-row form-grid-2" aria-label="Informações iniciais">
          <div>
            <label class="field">Nome da Professora
              <input id="PROFESSORA" name="PROFESSORA" type="text" required placeholder="Digite o nome da Professor">
            </label>
          </div>
          <div>
            <label class="field">Turma
              <input id="TURMA" name="TURMA" type="text" required placeholder="Ex: Maternal A">
            </label>
          </div>
		 <div>
			<label class="field">Data</label>
			<div style="display: flex; gap: 8px;">
				<input id="DIA" name="DIA" type="text" required placeholder="Dia">
				<input id="MES" name="MES" type="text" required placeholder="Mês">
				<input id="ANO" name="ANO" type="text" required placeholder="Ano">
			</div>
			</div>
          <div>
            <label class="field">Observador
              <input id="OBSERVADOR" name="OBSERVADOR" type="text" required placeholder="">
            </label>
          </div>
        </div>

        <!-- ===========================================================
             SEÇÃO III - MEDIAÇÃO DOCENTE
             Comentário: extensa seção com múltiplos campos para observação.
             Mantive a estrutura original com identificação de professora/turma/datas.
             ============================================================ -->
        <button type="button" class="accordion accent-3" data-panel="secao3" aria-expanded="false" id="secao3Btn">
          <div class="left">
            <span class="acc-icon" aria-hidden="true"></span>
            <div>
              <span class="acc-title">SEÇÃO III - MEDIAÇÃO DOCENTE</span>
              <span class="acc-sub">Observação de estratégias, gestão do grupo, materiais e mediações.</span>
            </div>
          </div>
          <svg class="acc-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9l6 6 6-6" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="secao3" class="panel" aria-hidden="true">
        
		  <br>
		  <br>

          <!-- 1. Estratégias Didáticas (1.1 a 1.4) -->
          <div class="form-row">
            <label class="field"><b>1. Estrategias Didáticas</b></label>
          </div>
		  <br>
		
		<div class="form-row">
            <label class="field"><b>1.1 Ampliação de Repertório Conecta a atividade às situações reais.</b></label>
          </div>

          <div class="form-row">
            <label class="field">Realiza leitura ou contação de histórias.</label>
            <select name="1.1.1">
              <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>

          <div class="form-row">
            <label class="field">Faz uso de perguntas abertas para instigar a curiosidade, o pensamento, o diálogo, e a formulação de hipóteses pelas crianças?  </label>
            <select name="1.1.2">
              <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>

		
          <div class="form-row">
            <label class="field">Utiliza materiais adequados ao tema e/ou à faixa etária. </label>
            <select name="1.1.3">
                <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>

          <div class="form-row">
            <label class="field">Utiliza abordagem lúdica (brincadeiras, jogos, cantigas) promovendo aprendizagens.</label>
            <select name="1.1.4">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		   <div class="form-row">
            <label class="field">Busca envolver todas ou a maior parte das crianças, citando nomes, chamando para participar, incluindo-as nas decisões.</label>
            <select name="1.1.5">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		     <div class="form-row">
            <label class="field">Apresenta conteúdos novos conectando com o cotidiano/ realidade de vida das  crianças fora da Unidade Escolar.</label>
            <select name="1.1.6">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <br>
          <br>  

          <!-- 1.2 Brincadeira -->
		    <br>  
		<div class="form-row">
            <label class="field"><b>1.2 Brincadeira </b></label>
          </div>
		  
		     <div class="form-row">
            <label class="field">Brincadeira livre: organiza previamente materiais, tempos e espaços destinados a essa vivência. </label>
            <select name="1.2.1">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		     <div class="form-row">
            <label class="field">Brincadeira livre: observa e acompanha as escolhas das crianças, intervindo com mediações sutis para ampliar a aprendizagem, realizando escuta ativa das crianças </label>
            <select name="1.2.2">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		     <div class="form-row">
            <label class="field">Brincadeira dirigida e jogos: professor organiza as brincadeiras mediando as ações com clareza permitindo a interação entre as crianças favorecendo o alcance dos objetivos propostos, realizando escuta ativa das crianças </label>
            <select name="1.2.3">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
         

          <!-- 1.3 Tipos de Práticas -->
		  
		     <br>  
		<div class="form-row">
            <label class="field"><b>1.3 Tipos de Práticas Pedagógicas</b></label>
          </div>
		  
		  <div class="form-row">
            <label class="field">Práticas que promovem expressão e comunicação (práticas relacionadas à oralidade, leitura, registros gráficos - desenhos, garatujas, letras, palavras, nome, textos coletivos, etc.) </label>
            <select name="1.3.1">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Práticas que promovem autonomia, autocuidado, autoconfiança  </label>
            <select name="1.3.2">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Práticas que promovem imaginação, investigação, transformações e criação (práticas relacionadas à contagem oral, relações de quantidade, levantamento de hipóteses,  registros numéricos, etc.) </label>
            <select name="1.3.3">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Práticas que promovem socialização: empatia, cooperação e autorregulação </label>
            <select name="1.3.4">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
 
		   <br>
		    <br>

          <!-- 2. Gestão do Grupo (2.1 Tempo e Rotina etc.) -->
          <div class="form-row">
            <label class="field"><b>2. Gestão do Grupo</b></label>
          </div>
		  
		  <br>
		  <div class="form-row">
            <label class="field"><b>2.1 Tempo e Rotina </b></label>
          </div>
		  
		  <div class="form-row">
            <label class="field">A rotina diária do professor (impressa ou afixada) contempla a prática da leitura e/ou contação de história.  </label>
            <select name="2.1.1">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Alterna entre momentos coletivos e individuais com fluidez.  </label>
            <select name="2.1.2">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Garante tempo de qualidade para interações entre crianças.  </label>
            <select name="2.1.3">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Evita tempos de espera; propõe atividades paralelas durante atendimentos individuais.  </label>
            <select name="2.1.4">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Durante a rotina, o ritmo das crianças é respeitado — evita acelerar, interromper ou conter. </label>
            <select name="2.1.5">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">A área externa é utilizada pelo menos por 30 minutos. (Aqui fazer observação das UE que contém apenas uma área externa) </label>
            <select name="2.1.6">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">As crianças não são deixadas sozinhas por mais de 5 minutos. </label>
            <select name="2.1.7">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>

          

          <!-- 2.2 Espaço -->
		  <br>
		  <div class="form-row">
            <label class="field"><b>2.2 Espaço</b></label>
          </div>
		  
		  <div class="form-row">
            <label class="field">Organizar agrupamentos variados (duplas, trios, grandes grupos) </label>
            <select name="2.2.1">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		  
		  <div class="form-row">
            <label class="field">Propõe atividades na área externa com organização e segurança para exploração ativa e segura e por  pelo menos 30 minutos   </label>
            <select name="2.2.2">
               <option value="">Selecione</option>
              <option value="Escolha1">Realizado de forma consistente </option>
              <option value="Escolha2">Realizado parcialmente ou com necessidade de ajustes </option>
              <option value="Escolha3">Não realizado </option>
            </select>
          </div>
		

          <!-- 2.3 Materiais -->
		  
		  <br>
		  <div class="form-row">
            <label class="field"><b>2.3 Materiais</b></label>

    /**
     * Script descritivo:
     * - Controla o comportamento do accordion (abrir/fechar com animação)

     * - Controla o botão "Novo Formulário" do header (reset + scroll suave + destaque)
     * - Fornece hooks para o botão Gerar PDF (atualmente placeholder)
     */

    document.addEventListener('DOMContentLoaded', function(){
      // ACCORDION: encontra todos os botões tipo accordion e liga o clique
      const accButtons = document.querySelectorAll('.accordion');
      accButtons.forEach(btn => {
        btn.addEventListener('click', function(){
          const panelId = this.getAttribute('data-panel');
          const panel = document.getElementById(panelId);
          const isOpen = panel.classList.contains('open');

          // fecha todos
          document.querySelectorAll('.panel').forEach(p => {
            p.classList.remove('open');
            p.style.maxHeight = null;
            p.setAttribute('aria-hidden','true');
          });
          document.querySelectorAll('.acc-arrow').forEach(a => a.style.transform = 'rotate(0deg)');

          if(!isOpen){
            // abre o selecionado
            panel.classList.add('open');
            panel.setAttribute('aria-hidden','false');
            panel.style.maxHeight = panel.scrollHeight + 'px';
            // gira a seta do botão clicado
            const arrow = this.querySelector('.acc-arrow');
            if(arrow) arrow.style.transform = 'rotate(180deg)';
          } else {
            panel.classList.remove('open');
            panel.setAttribute('aria-hidden','true');
            panel.style.maxHeight = null;
            const arrow = this.querySelector('.acc-arrow');
            if(arrow) arrow.style.transform = 'rotate(0deg)';
          }
        });
      });

      // Inicialmente abre a primeira seção para orientação
      const firstBtn = document.querySelector('.accordion[data-panel="secao1"]');
      if(firstBtn) firstBtn.click();

      // atualiza ao digitar
      [crecheInput, turmaInput, turnoInput].forEach(el => {

      updateWhatsapp();
*/
      // BOTÃO RESET no header: faz reset completo e rola para top com destaque
